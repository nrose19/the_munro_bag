<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <title>The Munro Bag</title>

      <!--importing google fonts-->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Calistoga&display=swap" rel="stylesheet">
        
      <!--Bootstrap coreCSS-->
      <link href="https://getbootstrap.com/docs/4.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

      <!-- CSS loaded -->
      {% load static %}
      <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  </head>

  <body class="main-body">
      <!-- nav bar -->
      <div class="nav-menu">
              <a href="/" class="logo" id="home">
                  <p class="center-text">MB</p>
              </a>
              <div id="menuLinks">
                  <a href="/" class="nav-links">Home</a>
                  {% if user.is_authenticated %}
                    <a href="/munros/">Munros</a>
                    <a href="/profile/" class="nav-links">My Profile</a>
                    <a href="/logout/" class="nav-links">Logout</a>
                  {% else %}
                    <a href="/accounts/login/" class="nav-links">Login</a>
                    <a href="/accounts/register/" class="nav-links">Start Climbing!</a>
                  {% endif %}
              </div>
              <a href="#menuLinks" class="icon" onclick="mainToggle()">
                  <!-- <span class="menu-text"></span> -->
              </a>
      </div>
      <main>
          {% block content %}
          {% endblock %}
      </main>
        
      <!--Bootstrap coreJavaScript-->
      <!--Placed at theendofthedocument sothepagesloadfaster-->
      <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
      <script>
          window.jQuery || document.write('<scriptsrc="https://getbootstrap.com/docs/4.2/assets/js/vendor/jquery-slim.min.js"><\/script>')
      </script>
      <script src="https://getbootstrap.com/docs/4.2/dist/js/bootstrap.bundle.min.js">
      </script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.9.0/feather.min.js">
      </script>
      <script src="https://getbootstrap.com/docs/4.2/examples/dashboard/dashboard.js">
      </script>
  
  </body>
</html>
