{% extends "base.html" %}
{% load static %}


{% block content %}
    <div class="form-container center-container" style="height: auto; min-height: 80vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 20px;">
        
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3); margin-bottom: 10px;">The Munro Bag</h1>
            <p style="color: white; font-family: var(--small-font); font-size: 20px; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">Sign in to continue your journey</p>
        </div>

        <div class="auth-card glass-box" style="width: 100%; max-width: 450px; padding: 40px; border-radius: 20px; text-align: left;">
            <form method="post" class="auth-form">
                {% csrf_token %}
                
                {% if form.non_field_errors %}
                <div style="color: #ff6b6b; margin-bottom: 15px; font-family: var(--small-font);">
                    {{ form.non_field_errors }}
                </div>
                {% endif %}
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="{{ form.username.id_for_label }}" style="display: block; color: #333333; font-weight: 500; font-family: var(--small-font); font-size: 18px; margin-bottom: 8px;">Username</label>
                    {{ form.username }}
                </div>
                
                <div class="form-group" style="margin-bottom: 25px; position: relative;">
                    <label for="{{ form.password.id_for_label }}" style="display: block; color: #333333; font-weight: 500; font-family: var(--small-font); font-size: 18px; margin-bottom: 8px;">Password</label>
                    {{ form.password }}
                    <span class="password-toggle" onclick="togglePassword()" style="position: absolute; right: 15px; top: 42px; cursor: pointer; color: #666;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                </div>
                
                <div class="btn-container" style="margin-top: 30px;">
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; font-size: 20px; border-radius: 8px;">Login</button>
                </div>
            </form>
            
            <div style="margin-top: 25px; text-align: center; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px;">
                <p style="color: #333333; font-family: var(--small-font); font-size: 16px; margin: 0;">
                    Don't have an account? 
                    <a href="{% url 'registration_register' %}" class="login-link-highlight" style="color: var(--dark-blue); font-weight: bold; text-decoration: none; margin-left: 5px; transition: all 0.3s ease;">Register here &rarr;</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            var x = document.getElementById("id_password");
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }
        
        // Add placeholders to Django form fields
        document.addEventListener("DOMContentLoaded", function() {
            var usernameField = document.getElementById("id_username");
            if (usernameField) usernameField.placeholder = "Enter your username";
            
            var passwordField = document.getElementById("id_password");
            if (passwordField) passwordField.placeholder = "Enter your password";
        });
    </script>
{% endblock %}
