<!DOCTYPE html>
{% load staticfiles %}

<html>
    <head>
        <title>The Munro Bag</title>
        <!--importing google fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Calistoga&display=swap" rel="stylesheet">

        <!--Bootstrap coreCSS-->
        <link href="https://getbootstrap.com/docs/4.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

        <!--connecting our styles css sheet-->
        <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    </head>
<!-- make all the styles into classes (if using more than once), create id if using only once -->

    <body class="main-body">
        <div class="nav-menu">
            <a href="/munro/" class="logo" id="home">
                <p class="center-text">MB</p>
            </a>
            <div id="menuLinks">
                <a href="/munro/" class="nav-links">Home</a>
                <a href="/munro/profile/" class="nav-links">My Profile</a>
                <a href="" class="nav-links">Logout</a>
            </div>
            <a href="#menuLinks" class="icon" onclick="mainToggle()">
                <!-- <span class="menu-text"></span> -->
            </a>
        </div>

        <h1 class="center-container h1-homepage">The Munro Bag</h1>

        
        <div class="flex-container">
            <div class="box-munros">
                <h2 style="letter-spacing: 18px;">Scotland's</h2>
                <br />
                <h2 style="letter-spacing: 4px;">Highest  Munros</h2>
                <!-- styling the highest munros -->
                {% if top_munros %}
                    {% for m in top_munros %}
                    <div>{{ m.name }}</div>
                    {% endfor %}
                {% endif %}
            </div>
            <div style="width:40%; column-gap: 10%;">
                <div class="box-multiple" style="background-color: #4D86BB;">
                    <h2>About Munros</h2>
                </div>
                <div class="box-multiple" style="background-color: #A3CAE1;">
                    <h2>User Information</h2>
                </div>
            </div>
        </div>

        <!--Bootstrap coreJavaScript-->
        <!--Placed at theendofthedocument sothepagesloadfaster-->
        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
        <script>
            window.jQuery || document.write('<scriptsrc="https://getbootstrap.com/docs/4.2/assets/js/vendor/jquery-slim.min.js"><\/script>')
        </script>
        <script src="https://getbootstrap.com/docs/4.2/dist/js/bootstrap.bundle.min.js">
            </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.9.0/
            feather.min.js">
        </script>
        <script src="https://getbootstrap.com/docs/4.2/examples/dashboard/dashboard.js">
        </script>
    </body>


</html>
