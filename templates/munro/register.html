{% extends 'munro/base.html' %}
{% block title %}Register{% endblock %}
{% block body_block %}
    <div class="container mt-5">
        <h2>Create an Account</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ user_form.as_p }}
            {{ profile_form.as_p }}
            <button type="submit" class="btn btn-success">Register</button>
        </form>
    </div>
{% endblock %}
